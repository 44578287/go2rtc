name: PTZ Development

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/xiaomi-ptz-onvif'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Compile PTZ-related packages
        run: go test ./internal/streams ./pkg/xiaomi/miss ./pkg/onvif ./internal/onvif -run '^$'

      - name: Run PTZ unit tests
        run: go test ./pkg/xiaomi/miss ./pkg/onvif -run 'PTZ'

      - name: Build go2rtc
        run: go build -trimpath .
